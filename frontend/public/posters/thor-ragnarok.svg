<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="450" fill="url(#ragBg)"/>
  <rect width="300" height="450" fill="url(#neonGlow)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Crossed Swords & Lightning Motif -->
  <g transform="translate(150, 195)">
    <!-- Synthwave Sun circle -->
    <circle r="55" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <circle r="40" fill="#0f172a" stroke="#2dd4bf" stroke-width="2"/>
    <!-- Lightning Bolt -->
    <polygon points="0,-45 10,-5 -5,-5 8,40 -12,5 2,5" fill="#facc15" stroke="#f59e0b" stroke-width="1"/>
    <!-- Gladiator dual blade outlines -->
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="6" text-anchor="middle">THOR</text>
  <text x="150" y="352" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="4" text-anchor="middle">RAGNAROK</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#2dd4bf" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2017 • 130M</text>
</svg>
