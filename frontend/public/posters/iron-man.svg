<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="50%" stop-color="#0f0505"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f0505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#bg)"/>
  <rect width="300" height="450" fill="url(#arcGlow)"/>

  <!-- Subtle grid lines -->
  <line x1="20" y1="20" x2="280" y2="20" stroke="#ca8a04" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="20" y1="430" x2="280" y2="430" stroke="#ca8a04" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="20" y1="20" x2="20" y2="430" stroke="#ca8a04" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="280" y1="20" x2="280" y2="430" stroke="#ca8a04" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Top Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Arc Reactor Motif -->
  <g transform="translate(150, 195)">
    <!-- Outer Ring -->
    <circle r="60" fill="none" stroke="#ca8a04" stroke-width="2" stroke-opacity="0.6"/>
    <circle r="52" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Triangular Core -->
    <polygon points="0,-35 30,20 -30,20" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <circle r="14" fill="#0284c7" fill-opacity="0.5"/>
    <circle r="8" fill="#e0f2fe"/>
    <!-- Tech markings -->
    <circle r="72" fill="none" stroke="#991b1b" stroke-width="1" stroke-dasharray="12,12"/>
  </g>

  <!-- Title & Metadata -->
  <text x="150" y="340" fill="url(#goldText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="3" text-anchor="middle">IRON MAN</text>
  <text x="150" y="365" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" letter-spacing="4" text-anchor="middle">WHERE IT ALL BEGAN</text>
  
  <rect x="115" y="385" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="399" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2008 • 126M</text>
</svg>
