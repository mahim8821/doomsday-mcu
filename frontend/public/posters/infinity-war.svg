<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="iwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>
    <radialGradient id="cosmicGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f0728" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="450" fill="url(#iwBg)"/>
  <rect width="300" height="450" fill="url(#cosmicGlow)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#6b21a8" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- 6 Infinity Stones & Gauntlet Ring -->
  <g transform="translate(150, 195)">
    <!-- Gauntlet Silhouette Ring -->
    <circle r="60" fill="none" stroke="#ca8a04" stroke-width="3" stroke-opacity="0.8"/>
    <circle r="42" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="8,6"/>
    
    <!-- 6 Infinity Stones glowing in orbital placement -->
    <!-- Power (Purple) -->
    <circle cx="0" cy="-42" r="8" fill="#c084fc" stroke="#7e22ce" stroke-width="2"/>
    <!-- Space (Blue) -->
    <circle cx="36" cy="-21" r="8" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Reality (Red) -->
    <circle cx="36" cy="21" r="8" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
    <!-- Soul (Orange) -->
    <circle cx="0" cy="42" r="8" fill="#fb923c" stroke="#c2410c" stroke-width="2"/>
    <!-- Time (Green) -->
    <circle cx="-36" cy="21" r="8" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <!-- Mind (Yellow Center) -->
    <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#a16207" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="3" text-anchor="middle">AVENGERS</text>
  <text x="150" y="352" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">INFINITY WAR</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#e9d5ff" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2018 • 149M</text>
</svg>
