<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="egBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="quantumGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#egBg)"/>
  <rect width="300" height="450" fill="url(#quantumGlow)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Restored Quantum Avengers "A" with Hourglass Motif -->
  <g transform="translate(150, 195) scale(0.95)">
    <!-- Golden Quantum Ring -->
    <circle r="65" fill="none" stroke="url(#goldPurple)" stroke-width="3.5" stroke-dasharray="280,120"/>
    
    <!-- Central stylized A -->
    <path d="M-15,45 L15,-45 L32,-45 L50,45 L30,45 L22,12 L-4,12 L-10,45 Z M9,-20 L-1,3 L19,3 Z" fill="#f8fafc"/>
    <polygon points="10,8 45,8 40,2 60,11 40,20 45,14 10,14" fill="#f59e0b"/>

    <!-- Subtle hourglass particles -->
    <circle cx="-35" cy="-35" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="35" cy="35" r="2" fill="#c084fc" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="3" text-anchor="middle">AVENGERS</text>
  <text x="150" y="355" fill="url(#goldPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">ENDGAME</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2019 • 181M</text>
</svg>
