<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="avBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="avGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#avBg)"/>
  <rect width="300" height="450" fill="url(#avGlow)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Iconic Avengers Crest "A" -->
  <g transform="translate(150, 195) scale(0.95)">
    <!-- Outer Incomplete Ring -->
    <circle r="65" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="320,80" stroke-dashoffset="30"/>
    <!-- Central stylized A -->
    <path d="M-15,45 L15,-45 L32,-45 L50,45 L30,45 L22,12 L-4,12 L-10,45 Z M9,-20 L-1,3 L19,3 Z" fill="url(#metalA)"/>
    <!-- Arrow Accent -->
    <polygon points="10,8 45,8 40,2 60,11 40,20 45,14 10,14" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="150" y="330" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">THE AVENGERS</text>
  <text x="150" y="355" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="4" text-anchor="middle">EARTH'S MIGHTIEST HEROES</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2012 • 143M</text>
</svg>
