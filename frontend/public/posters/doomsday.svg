<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="doomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="45%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#061f18"/>
    </linearGradient>
    <radialGradient id="doomGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="doomGreenText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="metalMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#doomBg)"/>
  <rect width="300" height="450" fill="url(#doomGlow)"/>

  <!-- Crisp Cinema Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Doctor Doom Iron Mask / Emerald Halo Motif -->
  <g transform="translate(150, 195)">
    <!-- Ominous Halo -->
    <circle r="65" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
    <circle r="55" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="10,6" stroke-opacity="0.8"/>

    <!-- Hood Outline -->
    <path d="M-45,35 C-45,-40 -25,-60 0,-65 C25,-60 45,-40 45,35 C25,25 0,35 -45,35 Z" fill="#064e3b" stroke="#047857" stroke-width="2"/>

    <!-- Metal Mask Faceplate -->
    <path d="M-28,-25 L28,-25 L24,20 L0,35 L-24,20 Z" fill="url(#metalMask)" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Glowing Slit Eyes -->
    <ellipse cx="-12" cy="-5" rx="7" ry="2.5" fill="#a7f3d0" stroke="#10b981" stroke-width="1"/>
    <ellipse cx="12" cy="-5" rx="7" ry="2.5" fill="#a7f3d0" stroke="#10b981" stroke-width="1"/>

    <!-- Rivets / Vent slits -->
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#1e293b" stroke-width="2"/>
    <line x1="-8" y1="18" x2="8" y2="18" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="4" text-anchor="middle">AVENGERS</text>
  <text x="150" y="355" fill="url(#doomGreenText)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" letter-spacing="5" text-anchor="middle">DOOMSDAY</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#022c22" stroke="#059669" stroke-width="1"/>
  <text x="150" y="394" fill="#6ee7b7" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2026 • 180M</text>
</svg>
