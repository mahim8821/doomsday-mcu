<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="caBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#060c18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="450" fill="url(#caBg)"/>
  <rect width="300" height="450" fill="url(#shieldGlow)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Vibranium Shield Emblem -->
  <g transform="translate(150, 195)">
    <!-- Outer Red Ring -->
    <circle r="65" fill="#dc2626"/>
    <!-- Silver Ring -->
    <circle r="52" fill="#cbd5e1"/>
    <!-- Inner Red Ring -->
    <circle r="39" fill="#dc2626"/>
    <!-- Blue Center -->
    <circle r="26" fill="#1d4ed8"/>
    <!-- White Star -->
    <polygon points="0,-20 6,-6 20,-6 9,3 13,18 0,9 -13,18 -9,3 -20,-6 -6,-6" fill="#f8fafc"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">CAPTAIN AMERICA</text>
  <text x="150" y="348" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="3" text-anchor="middle">THE FIRST AVENGER</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#93c5fd" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2011 • 124M</text>
</svg>
