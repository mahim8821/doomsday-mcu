<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cwBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="49%" stop-color="#090a14"/>
      <stop offset="51%" stop-color="#14070a"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <rect width="300" height="450" fill="url(#cwBg)"/>

  <!-- Border -->
  <rect x="15" y="15" width="270" height="420" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Marvel Banner -->
  <rect x="110" y="35" width="80" height="18" fill="#e11d48" rx="2"/>
  <text x="150" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" letter-spacing="2" text-anchor="middle">MARVEL</text>

  <!-- Split Shield vs Iron Man Duel Motif -->
  <g transform="translate(150, 195)">
    <!-- Dividing Lightning Slash -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- Left Cap Half-Shield -->
    <path d="M0,-55 A55,55 0 0,0 0,55 Z" fill="#1d4ed8"/>
    <path d="M0,-42 A42,42 0 0,0 0,42 Z" fill="#dc2626"/>
    <path d="M0,-28 A28,28 0 0,0 0,28 Z" fill="#f8fafc"/>
    <path d="M0,-16 A16,16 0 0,0 0,16 Z" fill="#1e3a8a"/>

    <!-- Right Iron Man Half-Face / Arc Glow -->
    <path d="M0,-55 A55,55 0 0,1 0,55 Z" fill="#7f1d1d"/>
    <path d="M0,-42 A42,42 0 0,1 0,42 Z" fill="#b45309"/>
    <path d="M0,-28 A28,28 0 0,1 0,28 Z" fill="#991b1b"/>
    <circle cx="20" cy="-5" r="10" fill="#38bdf8" fill-opacity="0.9"/>
  </g>

  <!-- Typography -->
  <text x="150" y="325" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" letter-spacing="2" text-anchor="middle">CAPTAIN AMERICA</text>
  <text x="150" y="352" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">CIVIL WAR</text>
  
  <rect x="115" y="380" width="70" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="150" y="394" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2016 • 147M</text>
</svg>
